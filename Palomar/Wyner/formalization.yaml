# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for the Palomar submission of Wyner's spherical covering
# exponent. The submitted project is this repository root; the Comparator configuration
# is Palomar/Wyner/comparator.json. See Palomar/README.md.
version: "v0.4"

project:
  name: "Wyner's spherical covering exponent"
  description: >-
    For a fixed angular radius theta in (0, pi/2), the least number M(n, theta) of
    spherical caps of angular radius theta, centred at points of the unit sphere of R^n,
    whose union is that whole sphere satisfies (1/n) log M(n, theta) -> -log sin theta as
    n -> infinity. This is the covering half of Wyner (1967): the elementary volume bound
    gives the lower bound on the covering number and a random-covering argument gives the
    upper bound. The statement is given in Mathlib's own vocabulary, as an asymptotic for
    Metric.coveringNumber of Metric.sphere 0 1 in EuclideanSpace R (Fin n) at chordal
    radius 2 sin (theta/2), and introduces no definition of its own; two compared lemmas
    establish that an angular cap of half-angle theta about a unit vector is exactly the
    closed chordal ball of that radius, which is what licenses reading the result as a
    statement about caps. Two further compared theorems rule out the junk values that the
    N-infinity-valued covering number and the logarithm would otherwise admit.
  # George A. Constantinides is the author in the sense Palomar publishes: the person
  # responsible for the result. The Lean statement and proof were generated by Claude
  # Opus 5, which is recorded under `automation` below rather than here.
  authors:
    - name: "George A. Constantinides"
      orcid: "https://orcid.org/0000-0002-0201-310X"
  license: "Apache-2.0"
  responsible_maintainers:
    - "George A. Constantinides"

classification:
  arxiv: ["math.MG", "cs.IT"]
  msc2020: ["52C17", "41A46", "94B65"]

sources:
  - title: "Random packings and coverings of the unit n-sphere"
    authors:
      - "A. D. Wyner"
    id: "doi:10.1002/j.1538-7305.1967.tb04246.x"
    type: "paper"
    location: "Bell System Technical Journal 46 (1967), no. 9, 2111-2118"
    relationship: "formalizes"
    note: >-
      Formalises the covering half of the paper: equations (2a) and (2b), restated as a
      limit on p. 2116, lim (1/n) log M_c(n, theta) = R_c(theta) with
      R_c(theta) = -log sin theta for theta < pi/2. Both halves of Wyner's argument are
      reproduced, namely the elementary volume bound (Lemma 2, p. 2115) for the lower
      bound and the random-covering argument (Theorem 2 and its corollary, pp. 2115-2117)
      for the upper bound. The packing results of the same paper are not formalised. See
      `fidelity.divergences` for the one place the formal statement departs from the
      paper's definition.
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/bardia01/Direction-Preserving-Number-Representations/blob/main/PaperProofs/PaperProofs/Wyner.lean"
    relationship: "adapts"
    note: >-
      An earlier formalisation of the same result by George A. Constantinides and Codex,
      produced as part of a paper coauthored with Bardia Zadeh. The submitted development
      is a refactoring of it: restructured into a single self-contained module, restated
      in terms of Mathlib's Metric.coveringNumber rather than a bespoke covering number,
      and reproved against a current Mathlib.

status:
  scope: >-
    Formalised: the covering exponent of Wyner (1967), as the limit
    (1/n) log M(n, theta) -> -log sin theta for fixed theta in (0, pi/2), together with
    the chord identity and the cap/ball equivalence that make it a statement about
    spherical caps, and the finiteness and positivity results that rule out junk values.
    Not formalised: the packing results of the same paper; any statement about open caps
    (see fidelity.divergences); and the degenerate dimension n = 0, which is not excluded
    by the statement but is invisible to a limit along atTop. No hypothesis of the source
    result has been strengthened and no conclusion weakened. The compared lemmas
    dist_eq_two_mul_sin_angle_div_two and angle_le_iff_dist_le are supporting results
    included so that the headline statement can be audited, not advertised as the
    theorem; the headline theorem is
    tendsto_log_coveringNumber_sphere_div_atTop.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "MiscMath.Geometry.tendsto_log_coveringNumber_sphere_div_atTop"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The result was selected and specified by the author, who fixed what the theorem
        should say, in what generality, and with which hypotheses. The Lean statement and
        the entire proof development were then generated by Claude Opus 5 running as an
        agent against a local Mathlib checkout, iterating against the Lean compiler. No
        part of the proof was written by a human, and no part of it has been read by one.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Not retained. The repository's CONTRIBUTING.md and CLAUDE.md record the standing
        instructions given for all such work, which concern statement quality rather than
        proof strategy: state results in Mathlib's vocabulary, avoid junk values and
        truncated subtraction, and ship a satisfiability witness for every hypothesis.
  spend_usd: "subscription-based"
  notes: >-
    This submission comes from a library whose division of labour is deliberate and is
    documented in its README. The human contribution is selection, specification, and a
    best-effort read of each Lean statement against its informal claim; the machine
    contribution is the formal statement and the proof. The proofs are read by nobody.
    What defends the library is mechanical rather than editorial: Lean's kernel for the
    proofs, an axiom audit requiring every declaration to depend only on propext,
    Classical.choice and Quot.sound, a self-test that plants a sorry and fails if the
    audit does not reject it, autoImplicit disabled so that a mistyped identifier cannot
    silently become a fresh variable, and a mandatory non-vacuity witness for every
    result with hypotheses. The failure mode this leaves open is a statement that does
    not say what its docstring claims, which is precisely what Palomar's review examines
    and why this result was submitted.

fidelity:
  divergences: >-
    One divergence, stated in the Challenge module docstring and in the docstring of the
    headline theorem. Wyner defines a theta-covering using open caps, angle u c < theta
    (p. 2112). Mathlib's Metric.IsCover, and hence Metric.coveringNumber, is stated with
    closed balls, so the formalised result concerns closed caps, angle u c <= theta. The
    exponent is unaffected, since a closed theta-cover is an open theta'-cover for every
    theta' > theta and -log sin is continuous, but the two covering numbers are not
    literally equal, and it is the closed one that is formalised. This has not been
    formally proved to imply the open-cap statement; the open-cap covering number does
    not appear anywhere in the development.
    Two further points of care, not divergences from the source but places where the
    Lean statement could be misread. Metric.coveringNumber is the internal covering
    number, requiring centres to lie on the sphere, which is what Wyner requires and is
    load-bearing: the result is false for Metric.externalCoveringNumber, since at
    theta = pi/3 the chordal radius is 1 and the single ball of radius 1 about the origin
    contains the whole sphere. And the statement applies ENat.toNat and Real.log, both of
    which have junk values; coveringNumber_sphere_ne_top and coveringNumber_sphere_pos
    are compared alongside the headline theorem to show that neither is reached for any
    n >= 1. The single exception is n = 0, where the sphere of R^0 is empty and the
    summand collapses to Real.log 0 / (0 : R) = 0, two junk conventions at once; a limit
    along atTop does not see it, but the statement does not exclude it either.

review:
  status: "self-assessed"
  reviewers:
    - "George A. Constantinides"
  notes: >-
    The author read the Lean statements below against the informal claim on a
    best-effort basis before publication. That read is genuine but explicitly not a
    review: one person, no second reader, none of the systematic scrutiny a Mathlib
    review would apply, and no reading of the proof. The proof development has been read
    by no one. The library states this plainly rather than implying more, and the checks
    that do carry weight are mechanical: kernel verification, the axiom audit, the audit
    self-test, and the non-vacuity witnesses recorded in the Sanity checks section of
    MiscMath/Geometry/SphereCoveringExponent.lean.

alignment:
  namespace: "MiscMath.Geometry"
  statements:
    - source: "Wyner (1967), eq. (2a)-(2b) and the limit restated on p. 2116"
      lean: "MiscMath.Geometry.tendsto_log_coveringNumber_sphere_div_atTop"
      module: "MiscMath.Geometry.SphereCoveringExponent"
      status: "adapted"
      note: >-
        The headline result. Adapted rather than proved-as-stated only in that Wyner's
        caps are open and the formalised ones are closed; see fidelity.divergences. The
        exponent and the range of theta are as in the source.
    - source: "Wyner (1967), p. 2112, the identification of a cap with a chordal ball"
      lean: "MiscMath.Geometry.angle_le_iff_dist_le"
      module: "MiscMath.Geometry.SphereCoveringExponent"
      status: "proved"
      note: >-
        Wyner works with angular caps throughout; the formal statement counts closed
        chordal balls. This is the equivalence that makes those the same thing, and it is
        compared so that the translation need not be taken on trust.
    - source: "Elementary; the chord length underlying the cap/ball identification"
      lean: "MiscMath.Geometry.dist_eq_two_mul_sin_angle_div_two"
      module: "MiscMath.Geometry.SphereCoveringExponent"
      status: "proved"
      note: "Supporting identity for angle_le_iff_dist_le, not a claim of the source."
    - source: "Implicit in Wyner's use of a finite covering number"
      lean: "MiscMath.Geometry.coveringNumber_sphere_ne_top"
      module: "MiscMath.Geometry.SphereCoveringExponent"
      status: "proved"
      note: >-
        Not a theorem of the paper. It rules out the junk value of ENat.toNat at the top
        element, so that the quantity in the headline limit is the covering number rather
        than a truncation of it.
    - source: "Implicit in Wyner's use of log M(n, theta)"
      lean: "MiscMath.Geometry.coveringNumber_sphere_pos"
      module: "MiscMath.Geometry.SphereCoveringExponent"
      status: "proved"
      note: >-
        Not a theorem of the paper. It rules out Real.log 0 for every n >= 1. The
        hypothesis 1 <= n cannot be dropped: the sphere of R^0 is empty.

acknowledgements: >-
  Built on Mathlib, whose Metric.coveringNumber, Measure.toSphere and
  EuclideanSpace.volume_ball supply the vocabulary and the measure-theoretic input for
  this result. Thanks to Bardia Zadeh, coauthor of the paper in which an earlier
  formalisation of this result appeared.
