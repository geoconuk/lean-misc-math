# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for the Palomar submission of Hoeffding's extrema of the number
# of successes at a fixed mean. The submitted project is this repository root; the
# Comparator configuration is Palomar/Hoeffding/comparator.json. See Palomar/README.md.
version: "v0.4"

project:
  name: "Hoeffding's extrema of the number of successes at a fixed mean"
  description: >-
    For n independent trials with success probabilities p_1, ..., p_n in [0,1] -- Poisson
    trials -- and S the number of successes, three results about how the law of S varies
    over all trial vectors with a given mean lam, with pbar = lam/n the common success
    probability of the homogeneous trials of the same mean. First, for g convex on the
    integer grid, E[g S] is maximised by the binomial, and under strict grid convexity
    equality holds exactly at the constant vector (Hoeffding's Theorem 3). Second, for
    arbitrary g with no convexity assumed, the maximum and the minimum of E[g S] over the
    fixed-mean box are attained at points whose coordinates take at most three distinct
    values, at most one of them strictly between 0 and 1 (Corollary 2.1). Third, away from
    the mean the binomial extremises the lower tail: for k >= lam the homogeneous vector
    has the lightest lower tail and for k <= lam - 1 the heaviest (two of the three
    regimes of Theorem 4). Every compared statement is written without any definition of
    its own: the probability model, the tail and the binomial comparator are expanded into
    raw Finset sums, products and filters from Mathlib, so that each claim can be audited
    against the informal statement without first accepting a definition.
  # George A. Constantinides is the author in the sense Palomar publishes: the person
  # responsible for the result. The Lean statement and proof were generated by Claude
  # Opus 5, which is recorded under `automation` below rather than here.
  #
  # A deliberate, single deviation from the v0.4 schema, which types `project.authors` as
  # an array of strings and offers no field for an ORCID anywhere. Palomar's intake accepts
  # the author-mapping form, and the mechanical report for submission eic7zf34a9x8 -- filed
  # with authors as plain strings -- came back with `orcid_validation.records` empty, so a
  # schema-conformant file simply loses the identifier from the record. For a library whose
  # citation model rests on crediting a named person, having the ORCID in the permanent
  # record is worth more than conforming on this one field. Everything else here validates.
  authors:
    - name: "George A. Constantinides"
      orcid: "https://orcid.org/0000-0002-0201-310X"
  license: "Apache-2.0"
  responsible_maintainers:
    - "George A. Constantinides"

classification:
  arxiv: ["math.PR", "math.ST"]
  msc2020: ["60E15", "62E15", "60C05"]

sources:
  - title: "On the distribution of the number of successes in independent trials"
    authors:
      - "Wassily Hoeffding"
    id: "doi:10.1214/aoms/1177728178"
    type: "paper"
    location: "Annals of Mathematical Statistics 27 (1956), no. 3, 713-721"
    relationship: "formalizes"
    note: >-
      Formalises Theorem 3 (p. 717, equations (22)-(23)) with its equality clause,
      Corollary 2.1 (p. 717, following Theorem 2) in both the maximising and the
      minimising direction, and two of the three regimes of Theorem 4 (p. 718, equations
      (24)-(29)): the upper bound of (24), the lower bound of (26), and the trivial bounds
      that accompany them in the paper's display. Theorem 3's inequality is proved under a
      weaker hypothesis than the paper's, which assumes strict grid convexity throughout;
      strictness is needed only for the equality clause. Theorems 1 and 2 are not
      formalised, since the route taken to Corollary 2.1 is a terminating exchange
      argument that needs neither. See `fidelity.divergences` for what is deliberately not
      claimed.
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Formalised: Hoeffding's Theorem 3 and its equality clause, Corollary 2.1 in both
    directions, and the two extreme regimes of Theorem 4 together with the trivial bounds
    accompanying them. Not formalised: equation (25), the middle regime np - 1 < c < np of
    Theorem 4, whose bound is an auxiliary maximum; equation (29), which locates the
    maximising index; the uniqueness half of Theorem 4's attainment statement, which rests
    on the paper's Theorem 2 and carries the bound c < n; and Theorem 5, omitted by choice
    rather than by obstacle, since its inequality is a subtraction away from what is proved
    but its uniqueness clause again rests on Theorem 2, and formalising the inequality
    alone would name a theorem after considerably less than the theorem. No hypothesis of
    a formalised result has been strengthened and no conclusion weakened; Theorem 3's
    inequality is proved under a strictly weaker hypothesis than the source assumes. The
    scope of the missing middle regime is itself bounded in the Solution's supporting
    module MiscMath.Probability.PoissonTrialsFixedMean.TailBounds, by
    thm4_gap_subsingleton, thm4_gap_eq_floor and thm4_gap_empty_of_natCast: the uncovered
    regime is an open interval of length 1 and so holds at most one integer threshold,
    that threshold is the floor of the mean, and there is none at all when the mean is a
    whole number. The same module's thm4_lower_needs_le_sub_one records why that regime is
    excluded rather than merely unattempted: at p = (1, 1/2) on two trials the mean is 3/2
    and the threshold k = 1 lies below it but outside the regime, and there the comparison
    reverses. The second regime's hypothesis is therefore k <= lam - 1 and not k < lam, and
    the difference decides the truth of the claim rather than being a margin of caution. Those three are not among the compared declarations because they are
    declared in a supporting module rather than in the Solution module, but a reviewer
    checking the scope claim will find them there.
    One further labelling point. The Solution module's documentation records that all four
    of Theorem 4's bounds are attained, and the supporting module proves it, but no
    attainment statement is among the five compared declarations: what is recorded here is
    the inequalities. Attainment is a result of the surrounding library, not of this
    submission, and the compared interface was not widened merely for completeness.
  sorry_count: 0
  sorry_in_definitions: 0
  # v0.4 asks for every axiom used, standard ones included, so this is not the permitted
  # list but the actual one, read off `#print axioms` for each compared declaration. All
  # five give the same three.
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # All five compared declarations, so that this inventory and comparator.json name the
  # same set. Theorem 3's equality clause and Corollary 2.1's minimising direction are
  # advertised by the informal statement and are principal claims, not supporting lemmas.
  main_results:
    - declaration: "MiscMath.Probability.hoeffding_thm3_unfolded"
      file: "MiscMath/Probability/PoissonTrialsFixedMean.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Hoeffding/comparator.json"
    - declaration: "MiscMath.Probability.hoeffding_thm3_eq_iff_unfolded"
      file: "MiscMath/Probability/PoissonTrialsFixedMean.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Hoeffding/comparator.json"
    - declaration: "MiscMath.Probability.hoeffding_cor21_unfolded"
      file: "MiscMath/Probability/PoissonTrialsFixedMean.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Hoeffding/comparator.json"
    - declaration: "MiscMath.Probability.hoeffding_cor21_min_unfolded"
      file: "MiscMath/Probability/PoissonTrialsFixedMean.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Hoeffding/comparator.json"
    - declaration: "MiscMath.Probability.hoeffding_thm4_unfolded"
      file: "MiscMath/Probability/PoissonTrialsFixedMean.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Hoeffding/comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The result was selected and specified by the author, who fixed what the theorems
        should say, in what generality, and with which hypotheses. The Lean statements and
        the entire proof development were then generated by Claude Opus 5 running as an
        agent against a local Mathlib checkout, iterating against the Lean compiler. No
        part of the proof was written by a human, and no part of it has been read by one.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Not retained. The repository's CONTRIBUTING.md and CLAUDE.md record the standing
        instructions given for all such work, which concern statement quality rather than
        proof strategy: state results in Mathlib's vocabulary, avoid junk values and
        truncated subtraction, and ship a satisfiability witness for every hypothesis.
  spend_usd: "subscription-based"
  notes: >-
    This submission comes from a library whose division of labour is deliberate and is
    documented in its README. The human contribution is selection, specification, and a
    best-effort read of each Lean statement against its informal claim; the machine
    contribution is the formal statement and the proof. The proofs are read by nobody.
    What defends the library is mechanical rather than editorial: Lean's kernel for the
    proofs, an axiom audit requiring every declaration to depend only on propext,
    Classical.choice and Quot.sound, a self-test that plants a sorry and fails if the audit
    does not reject it, autoImplicit disabled so that a mistyped identifier cannot silently
    become a fresh variable, and a mandatory non-vacuity witness for every result with
    hypotheses.
    Since this development was published, the library has added one further guard, and it
    was applied to these statements. Before the author's read, the Lean statements were
    read back blind: rendered into English by an agent given the statements and nothing
    else -- no informal statement, no source, no docstring -- and the rendering compared
    against the informal account. It agreed. It confirmed that the truncated natural
    subtraction in both displays is harmless, that the fixed-mean box is inhabited exactly
    when 0 <= lam <= n so that Corollary 2.1 hides no vacuity, and that the shape clause of
    Corollary 2.1 is the three-value reading rather than the stronger vertex one. It
    surfaced two things, both since acted on: an empty-index-set degeneracy the informal
    statement had not named, and a summation variable in the equality clause of Theorem 3
    that shadowed the bound variable it was stated under.
    The prior formalisation of this material is disclosed under `fidelity.divergences`.

fidelity:
  divergences: >-
    No divergence between a compared statement and the source's corresponding claim. What
    follows is what is deliberately not claimed, and where a compared statement could be
    misread.
    Theorem 4 is stated in two regimes only. The paper's display covers three, and the
    middle one, np - 1 < c < np of equation (25), is absent along with equation (29) and
    the uniqueness half of the attainment statement. The compared statement asserts
    nothing whatsoever for a threshold in that gap. This is a restriction of scope, not a
    weakening of what is asserted where it is asserted.
    The trivial conjuncts of Theorem 4 are trivial. Under the standing hypotheses
    0 <= p_i <= 1 the tail lies in [0,1] unconditionally, so the bounds P[S <= k] <= 1 in
    the first regime and 0 <= P[S <= k] in the second carry no content beyond what the
    hypotheses already give. They are stated because the paper's display states them; the
    substantive content is the comparison with the binomial tail in each direction.
    Degenerate cases are not excluded by hypothesis. At an empty index set the common
    probability lam/n is 0/0 = 0 and every compared statement is true but empty: both
    sides of Theorem 3 collapse to g 0, and Theorem 4's first regime to 1 <= 1. Theorem
    4's second regime is vacuous whenever lam < 1, since the threshold is a natural number
    and the regime asks for k <= lam - 1. Both are recorded in the Challenge and in the
    Solution's module documentation.
    Truncated subtraction is present but harmless. The exponent n - j is natural
    subtraction. In Theorem 3 the summation index never exceeds n, so no truncation
    occurs; in Theorem 4 the index may exceed n, but the binomial coefficient vanishes
    there, so the truncated terms vanish rather than contributing a junk value.
    Prior formalisation. The submitted development is a refactoring of an earlier
    formalisation of the same paper by the same author, which was never published and is
    not publicly accessible; it has therefore no identifier to record under
    `related_formalizations`. The submitted development was restructured into a roof module
    over supporting modules, restated so that every advertised statement is free of the
    library's own definitions, and reproved against a current Mathlib.

review:
  status: "self-assessed"
  reviewers:
    - "George A. Constantinides"
  notes: >-
    The author read the Lean statements against the informal claim on a best-effort basis
    before publication, preceded by the blind read-back described under `automation.notes`.
    That read is genuine but explicitly not a review: one person, no second reader, none of
    the systematic scrutiny a Mathlib review would apply, and no reading of the proof. The
    proof development has been read by no one. The library states this plainly rather than
    implying more, and the checks that do carry weight are mechanical: kernel verification,
    the axiom audit, the audit self-test, and the non-vacuity witnesses recorded in the
    Sanity checks section of MiscMath/Probability/PoissonTrialsFixedMean.lean, which
    exhibit satisfying values for the hypotheses of every compared statement, including the
    universally quantified convexity hypothesis of Theorem 3 and a threshold in each of
    Theorem 4's two regimes.

alignment:
  namespace: "MiscMath.Probability"
  statements:
    - source: "Hoeffding (1956), Theorem 3, p. 717, equations (22)-(23)"
      lean: "MiscMath.Probability.hoeffding_thm3_unfolded"
      module: "MiscMath.Probability.PoissonTrialsFixedMean"
      status: "adapted"
      note: >-
        Adapted only by weakening: the paper assumes strict grid convexity throughout and
        this asserts the inequality under weak grid convexity, strictness being needed only
        for the equality clause below. The conclusion is the paper's.
    - source: "Hoeffding (1956), Theorem 3, the equality clause of p. 717"
      lean: "MiscMath.Probability.hoeffding_thm3_eq_iff_unfolded"
      module: "MiscMath.Probability.PoissonTrialsFixedMean"
      status: "proved"
      note: >-
        Under strict grid convexity, equality holds exactly at the constant vector. Stated
        as an iff, so both directions are asserted.
    - source: "Hoeffding (1956), Corollary 2.1, p. 717"
      lean: "MiscMath.Probability.hoeffding_cor21_unfolded"
      module: "MiscMath.Probability.PoissonTrialsFixedMean"
      status: "proved"
      note: >-
        The maximising direction. The shape clause asserts that the coordinates strictly
        inside (0,1) are all equal, which is the paper's "at most three values, at most one
        interior" and is weaker than a bound on how many coordinates are fractional.
    - source: "Hoeffding (1956), Corollary 2.1, p. 717"
      lean: "MiscMath.Probability.hoeffding_cor21_min_unfolded"
      module: "MiscMath.Probability.PoissonTrialsFixedMean"
      status: "proved"
      note: >-
        The minimising direction of the same corollary. Since no hypothesis is placed on g,
        this is interderivable with the maximising direction by replacing g with its
        negation; it is stated separately because the source asserts both.
    - source: "Hoeffding (1956), Theorem 4, p. 718, the upper bound of (24) and the lower bound of (26)"
      lean: "MiscMath.Probability.hoeffding_thm4_unfolded"
      module: "MiscMath.Probability.PoissonTrialsFixedMean"
      status: "adapted"
      note: >-
        Adapted by restriction of scope: two of the paper's three regimes, without the
        equality clause. See `fidelity.divergences` for exactly what is left out and for
        the bound on how much that is.

acknowledgements: >-
  Built on Mathlib, whose ProbabilityTheory.binomial and ProbabilityTheory.bernoulliMeasure
  the Solution module uses to tie its own definitions back to standard probability
  vocabulary, and whose Finset.prod_add is the single identity on which the normalisation
  of the model rests.
