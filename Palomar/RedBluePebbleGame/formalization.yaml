# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for the Palomar submission of Hong and Kung's red-blue pebble game. The
# submitted project is this repository root; the Comparator configuration is
# Palomar/RedBluePebbleGame/comparator.json. See Palomar/README.md.
version: "v0.4"

project:
  name: >-
    Hong and Kung's red-blue pebble game: the partition lemma and I/O lower bounds for the FFT and
    matrix multiplication
  description: >-
    The red-blue pebble game of Hong Jia-Wei and H. T. Kung (STOC 1981) models a computation on a
    directed acyclic graph run with S words of fast memory and unlimited slow memory: a red pebble
    on a vertex is its value held in fast memory, a blue pebble its value held in slow memory, and
    each load or store costs one I/O operation. This formalisation defines the game, complete
    calculations and the minimum I/O time Q, and proves three families of results from the paper,
    with explicit constants and, where the paper states one, in its asymptotic form. Q is 0 by
    convention where no complete calculation exists, so each statement about Q is made only where
    one does. First, the partition lemma (Theorem 3.1 and Lemma 3.1): every complete calculation
    with at most S red pebbles and q I/O operations yields a 2S-partition of the graph into h sets
    with q <= S h <= q + S, so that Q >= S (P(2S) - 1) wherever a complete calculation exists. Read
    literally, the paper's Theorem 3.1 is false in two ways, since its rules let inputs be computed
    free of charge and let inputs be vertices other than the sources; here, as in Elango et al.
    (2014), the inputs are exactly the sources and cannot be computed. Second, the n-point FFT
    graph, for n = 2^k with k >= 1: every S-dominator partition has h sets with n (log2 n + 1) <= h
    S log2(2S) (Theorem 4.1, with a per-set bound sharper than the paper's, which also closes a gap
    in its proof), a complete calculation exists exactly when S >= 3, and every complete calculation
    has q >= 2n and n log2 n <= 5 q log2 S (Corollary 4.1 with an explicit constant); Q log S =
    Omega(n log n) holds with one constant for all such n and all S >= 3, and P_D(S) = Omega(n log n
    / (S log S)) with one constant for all such n and all S >= 2. Third, matrix multiplication by
    the ordinary algorithm, for every graph in which the m k n products A_il B_lj are vertices of
    their own, each with an edge from its two factors, and no vertex can be reached from the
    products of two different entries of the result; for m, k, n >= 1 this class contains every
    independent evaluation in the paper's sense. Every complete calculation has m k n <= 2 q sqrt(S)
    (Corollary 6.2 with an explicit constant), and for k >= 1 also q >= mk + kn + mn; Q sqrt(S) =
    Omega(m k n) holds with one constant over any collection of such graphs, for every graph of the
    collection and every S at which that graph has a complete calculation; and for all m, k, n >= 1
    some such graph has a complete calculation exactly when S >= 3. Mathlib has no pebble games, so
    the statements rest on twelve definitions of the formalisation's own, which the Challenge
    restates for the reader. Not formalised: the paper's upper bounds (its Theorem 2.1 and section
    8, which it states without proof), its sections 5 and 7, and its Theorem 6.1 for general
    expressions.
  # George A. Constantinides is the author in the sense Palomar publishes: the person responsible
  # for the result. The Lean definitions, statements and proofs were generated by Claude Opus 5.5,
  # which is recorded under `automation` below rather than here.
  #
  # The author mapping, with its ORCID, is the form the three registered submissions from this
  # repository use. Palomar's verifier reads it (a person mapping with separate `name` and `orcid`
  # fields) and checks the iD against the ORCID Registry; the upstream v0.4 schema types
  # `project.authors` as an array of strings and has no field for an ORCID, so this one field
  # deviates from it, deliberately. Everything else here validates against it.
  authors:
    - name: "George A. Constantinides"
      orcid: "https://orcid.org/0000-0002-0201-310X"
  license: "Apache-2.0"
  responsible_maintainers:
    - "George A. Constantinides"

classification:
  arxiv: ["cs.CC", "cs.DS"]
  msc2020: ["68Q17", "68Q25", "05C57", "65T50", "65Y20"]

sources:
  - title: "I/O Complexity: The Red-Blue Pebble Game"
    authors:
      - "Hong Jia-Wei"
      - "H. T. Kung"
    id: "doi:10.1145/800076.802486"
    type: "paper"
    location: >-
      Proceedings of the 13th Annual ACM Symposium on Theory of Computing (STOC '81), pp. 326-333.
      The game, its standing assumptions on the graph and the definition of Q: section 2, p. 327.
      S-partitions (P1-P4), Theorem 3.1 and its proof: section 3, p. 328. P(S), Lemma 3.1,
      S-dominator partitions, P_D(S), Theorem 4.1 and Corollary 4.1: sections 3-4, p. 329.
      Independent evaluations (E1, E2) and Theorem 6.1: section 6, pp. 330-331. Lemma 6.1 and
      Corollary 6.2: section 6, p. 331. A scan is on H. T. Kung's page,
      https://www.eecs.harvard.edu/~htk/publication/1981-stoc-hong-kung.pdf
    relationship: "adapts"
    note: >-
      The source of every result formalised here, and of the game itself. The relationship is adapts
      rather than formalizes because one of the paper's statements and two of its proofs are
      corrected, and one statement is generalised. Corrected: Theorem 3.1, which is false under the
      paper's literal rules (its rule R3 lets an input be computed free of charge, since the
      condition that every predecessor hold a red pebble is vacuous for a source; and its section 2
      lets the inputs be any set containing the sources); its proof, whose cover argument misplaces
      an input still holding its initial blue pebble; and the proof of Theorem 4.1, whose induction
      applies the per-set bound 2S log S to parts of a dominator with a single vertex, where it is 0
      although a vertex dominates itself. The paper states that bound only for S >= 2, where it
      holds, so Theorem 4.1 stands; it is proved here with the sharper per-set bound d log2(2d),
      which closes the induction. Generalised: Corollary 6.2, which the paper derives for its
      independent evaluations and which is proved here for a wider class of graphs. Formalised as
      the paper states them, under the corrected model: Lemma 3.1 (Q >= S (P(2S) - 1), where a
      complete calculation exists), and the Omega forms of Theorem 4.1, Corollary 4.1 and Corollary
      6.2, with explicit constants alongside. Not formalised: Theorem 2.1 and the upper bounds of
      section 8, which the paper states without proof; sections 5 and 7; Theorem 6.1 for general
      expressions, with its S-combination number H(S); Lemma 6.1 as stated; and Corollary 6.1. The
      scan's text layer is unreliable; its page images are the authority for what the paper says.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: >-
      On characterizing the data movement complexity of computational DAGs for parallel execution
    authors:
      - "Venmugil Elango"
      - "Fabrice Rastello"
      - "Louis-Noël Pouchet"
      - "J. Ramanujam"
      - "P. Sadayappan"
    id: "arXiv:1404.4767"
    type: "paper"
    location: "arXiv:1404.4767 (2014)"
    relationship: "background"
    note: >-
      A later restatement of the red-blue pebble game in which the inputs are exactly the sources
      and inputs cannot be computed. The model formalised here makes the same two choices, and they
      are what repair the paper's Theorem 3.1. None of this paper's own results is formalised.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the hardness of red-blue pebble games"
    authors:
      - "Pál András Papp"
      - "Roger Wattenhofer"
    id: "arXiv:2005.08609"
    type: "paper"
    location: "arXiv:2005.08609 (2020)"
    relationship: "background"
    note: >-
      A later restatement of the model in which sources can be computed free of charge, the other
      reading of the paper's rule R3, cited for comparison with the choice made here. None of its
      results is formalised.
    license: "unknown"
    author_endorsement: "not-contacted"

# No earlier formalisation of the game or of these bounds was found, in Lean, Coq, Isabelle or
# Prove2Me's Formalpedia (searched 2026-09-25, and again on 2026-09-28); see
# fidelity.divergences.
related_formalizations: []

status:
  scope: >-
    Formalised, for computation DAGs (acyclic, the inputs exactly the sources, every sink an output,
    no input an output), in a game whose compute move does not apply to inputs: Hong and Kung's
    Theorem 3.1, corrected (exists_partition_of_hasCompleteCalculation); Lemma 3.1 in a finitary
    form (io_lower_bound_of_parts) and as the paper states it, where a complete calculation exists
    (minIOTime_lower_bound). For the 2^k-point FFT graph with k >= 1: Theorem 4.1 with a per-set
    bound sharper than the paper's (fft_parts_lower_bound) and in the paper's Omega form, for S >= 2
    (fft_parts_lower_bound_isBigO); feasibility, a complete calculation existing exactly when S >= 3
    (fft_complete_iff); the bounds q >= 2^(k+1) and q >= 2^k (k + 1) / (2 log2(4S)) - S
    (fft_io_bounds); Corollary 4.1 with the constant 1/5 (fft_io_lower_bound) and in the paper's
    Omega form, for S >= 3 (fft_io_lower_bound_isBigO). For matrix multiplication by the ordinary
    algorithm, over the class IsMatMulEvaluation, which for m, k, n >= 1 contains every independent
    evaluation in the paper's sense: at every size m, k, n >= 1 some graph of the class has a
    complete calculation exactly when S >= 3 (exists_isMatMulEvaluation); for k >= 1, the bounds q
    >= mk + kn + mn and q >= mkn / sqrt(2S) - S (matMul_io_bounds); Corollary 6.2 with the constant
    1/2 (matMul_io_lower_bound) and in the paper's Omega form over any collection of graphs of the
    class, wherever a complete calculation exists (matMul_io_lower_bound_isBigO). Not formalised:
    Theorem 2.1 and every upper bound, which the paper states without proof; sections 5, 7 and 8;
    Theorem 6.1 for general expressions; Lemma 6.1 as stated; Corollary 6.1. The departures from the
    paper's model and statements are itemised under fidelity.divergences. Every compared statement
    with hypotheses has a satisfiability witness. fft_complete_iff and exists_isMatMulEvaluation are
    themselves the witnesses for the FFT and matrix-multiplication statements; for the partition
    lemma the FFT graph serves, being a computation DAG for every k >= 1. The Solution module's
    Sanity checks section adds complete calculations of the 2-point FFT with three red pebbles and
    four loads and stores, and of a 1 x 1 x 2 matrix product with three red pebbles and five loads
    and stores, each checked move by move by decide, at which every hypothesis of the corresponding
    statements holds; the minimum values these attain (Q = 4 and Q = 5, P(6) = 1 and P_D(1) = 4 for
    the 2-point FFT); and examples showing that the hypotheses k >= 1, the input condition of the
    compute move, each field of IsComputationDAG and the field independent of IsMatMulLabelling
    cannot be dropped. Those examples are not among the compared declarations, because they are
    anonymous examples in the Solution module rather than named theorems.
