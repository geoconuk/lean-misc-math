automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The result was selected and specified by the author, who fixed which of the paper's results
        to formalise, how to correct its model, and the form of each statement. The twelve
        definitions and thirteen statements were written by Claude Opus 5.5 in three phases -- the
        FFT; the partition lemma and Theorem 4.1; matrix multiplication -- and each phase's were
        read back blind, read by the author, and frozen as a target file outside the audited
        library, with the statements left as holes, before any proof of that phase was built. The
        proofs were then built by Claude Opus 5.5 running as an agent against a local Mathlib
        checkout, iterating against the Lean compiler, with a type-check module asserting that the
        proved statements are the frozen target statements. No part of the proof was written by a
        human, and no human has read it.
      cost:
        wall_time: >-
          three days of sessions, 2026-09-25 to 2026-09-27, from the assessment of the paper to
          the release of the proved result
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Not retained verbatim. A written plan fixed the scope, the corrections and the proof route
        of each phase before it was written, and brute-force computations checked the paper's
        counterexamples and the tight cases of the corrected bounds before any Lean was written.
        The repository's CONTRIBUTING.md and CLAUDE.md record the standing instructions given for
        all such work, which concern statement quality rather than proof strategy: state results
        in Mathlib's vocabulary, avoid junk values and truncated subtraction, and guard every
        statement against vacuity.
  spend_usd: "subscription-based"
  notes: >-
    This submission comes from a library whose division of labour is deliberate and is documented
    in its README. The human contribution is selection, specification, and a best-effort read of
    each advertised Lean statement, and of the definitions it is stated through, against its
    informal claim; the machine contribution is the formal definitions, the
    statements and the proofs. No human has read the proofs, and every declaration other than the
    thirteen compared statements and the twelve definitions they are stated through is proof and
    may be read by no one; no read of it by a person is claimed. The one reading the proofs have
    had is the machine read described below, whose scope is stated exactly so that it is not taken
    for more. What defends the library is mechanical rather than editorial: Lean's kernel for the
    proofs, an axiom audit requiring every declaration to depend only on propext,
    Classical.choice and Quot.sound, a self-test that plants a sorry and fails if the audit does
    not reject it, autoImplicit disabled so that a mistyped identifier cannot silently become a
    fresh variable, and a non-vacuity guard for every result.
    Three arrangements specific to this result. First, the statements were fixed before the
    proofs, in three phases: each phase's definitions and statements were read by the author and
    frozen in Target/RedBluePebbleGame.lean (commits 783e5a3; 7c3c34d and d971e3f; 0049cbf) before
    any of its proofs existed, and Target/RedBluePebbleGame/TypeCheck.lean, which CI builds,
    ascribes each frozen type to the theorem proved. The thirteen statements of the Challenge are
    those frozen statements, word for word, and its twelve definitions are those of
    MiscMath/Computability/RedBluePebbleGame/Spec.lean, byte for byte, whose text has not changed
    since the last freeze. For this submission Spec.lean's imports were extended to the
    Challenge's import list, so that the Challenge's copy of each definition elaborates to the same
    term as the library's, which Comparator requires; with the shorter list, one instance argument
    in IsMatMulLabelling elaborated differently in the two copies, though to a definitionally equal
    term. No definition's text or meaning changed. Second, before the author's read the
    statements were read back blind, two rounds per phase: an agent given the statements and the
    definitions they read, and nothing else -- no informal statement, no source, no docstring --
    rendered them into English, and the rendering was compared with the intended statements. The
    rounds surfaced that a move that could be either a load or a computation may be charged
    either way, that the second bound of fft_io_bounds says nothing once S >= n/2, that the
    asymptotic statements imply a calculation exists wherever they apply, that under the graph
    hypotheses S <= 1 leaves only the empty graph, that empty sets make q <= S h free in Theorem
    3.1, and that the matrix-multiplication class is weak at degenerate sizes, where the bounds on
    m k n say nothing; each point is stated in the Challenge's reading notes. The renderings are
    kept verbatim, with the model that wrote them and the date, in
    docs/readbacks/Computability/RedBluePebbleGame.md. Third, before publication, on 2026-09-27,
    an independent review of commit 0c9bac9 by an OpenAI Codex agent wrote down its own reading of
    the twelve definitions and thirteen statements before reading the docstring or the paper, then
    compared it with both (pp. 327-331). It re-ran the build, a fresh axiom audit, the import and
    convention guards, the frozen targets and their type check, and an equivalent of the audit
    self-test. It reproduced, by computations of its own, the two counterexamples to the printed
    Theorem 3.1, the exclusion of Strassen's algorithm and four of the examples showing that a
    hypothesis cannot be dropped. It read Spec.lean whole and selected declarations in six of the
    other ten modules under RedBluePebbleGame/, among them the repair of the paper's cover argument
    in Partition.lean, but not every proof. It reported no false advertised statement, no
    contradictory hypotheses and no unguarded junk value, and four errors in the prose, corrected
    before release. It ran no second kernel, and its build reused cached artifacts. It is a machine
    read, not a human one, and not a review; the review account below says the same. The result was
    released as lean-misc-math v0.4.0 on 2026-09-27, after the library's release gate re-checked
    every audited declaration of that commit, with its dependency cone into Mathlib and Lean core,
    with con-leche, an external checker proven in Lean to accept only environments with a
    set-theoretic model. The submitted commit is later than that release. It ports the library to
    Lean's module system and moves it to Lean and Mathlib v4.35.0-rc3, both required by Palomar
    since September 2026, without changing the text of any statement or of the twelve definitions.
    Every notion the thirteen statements name has the same definition before and after the move, up
    to universe-parameter and hygienic binder names, checked by comparing every constant the
    statements reach through types and definitions, not proofs: Real.logb, Real.sqrt,
    Asymptotics.IsBigO, Finset.card, filter, univ and sum, Relation.ReflTransGen and TransGen, sInf
    on the natural numbers, Disjoint, Set.range, Fin.last, and the reals with their order and
    arithmetic. What changed lies deeper, in the internals of Mathlib's Cauchy construction of the
    reals and of its algebraic class hierarchy. The con-leche re-check described above was of the
    release commit. For the submitted commit, the toolchain's own lake comparator was run on this
    configuration before submission, with --paranoid: the thirteen statements matched, and Lean's
    kernel in its default and paranoid modes, lean4lean, NanoDa, con-leche and con-ron each accepted
    the Solution's export of 17,157 declarations. It was run without its sandbox, which exists to
    contain an untrusted solution.

fidelity:
  divergences: >-
    Against the paper's own formulation, the compared statements are made in a corrected model, rest
    on two corrected proofs, generalise one statement, add several, and state the paper's asymptotic
    claims under the strongest of their readings; they also make a few conventional choices, none of
    which changes a result. Each is itemised here, with the direction in which it departs. Corrected
    model, and so weaker in that respect than the printed statements, which are false without the
    correction. (1) An input cannot be computed. The paper's rule R3 places a red pebble on any
    vertex whose predecessors all hold red pebbles; for a source that is vacuous, so read literally
    the inputs can be computed free of charge. That makes Theorem 3.1 false: summing 8 inputs left
    to right with S = 3 costs one I/O, yet every 6-partition of that graph has at least two sets, so
    the theorem demands at least three. Here the compute move requires the vertex not to be an
    input, as in Elango et al. The Solution's sanity checks show the condition carries weight:
    without designated inputs the 2-point FFT costs 2 rather than 4. (2) The inputs are exactly the
    sources. The paper lets them be any set containing the sources (section 2), and uses that in
    section 7. That too makes Theorem 3.1 false: a chain of 17 designated inputs feeding one output
    has a calculation costing 2 with S = 2, so the theorem allows at most 2 sets, yet every
    4-partition has at least 3, whether or not paths of length 0 count in dominators (the Solution's
    sanity checks, for the reading in which they count). The graph hypotheses of the compared
    statements, IsComputationDAG, are the paper's section 2 assumptions with this restriction:
    acyclic, the inputs exactly the sources, every sink an output, no input an output. Corrected
    proofs. Theorem 4.1's: the paper claims, for S >= 2, that a set with a dominator of at most S
    vertices has at most 2S log S vertices, and that holds, but its induction applies the bound to
    the parts of a dominator, which may have a single vertex, and at 1 it is 0 although a vertex
    dominates itself. Here the bound is d log2(2d) for a dominator of d vertices: it holds at d = 1
    too, which closes the induction, is at most 2d log2 d for d >= 2, and is exact at d = 1, 2, 4.
    So fft_parts_lower_bound carries S log2(2S), for every S >= 1, and Theorem 4.1 as the paper
    states it, for S >= 2, is unaffected. Theorem 3.1's: its Case 1 places a predecessor holding a
    pebble of either colour when a subcalculation starts in an earlier set, on the grounds that
    every pebble follows a red one; an input still holding its initial blue pebble has had no red
    one, so it lies in no earlier set. Here the split is on a red pebble; such an input then falls
    under the paper's Case 2, and the conclusion stands. Generalised: Corollary 6.2. The paper
    derives it from its Theorem 6.1, about independent evaluations (E1, E2), in which the products
    are formed first and each entry of the result is summed from its own products by a tree of
    additions and subtractions sharing no vertex with another entry's. IsMatMulEvaluation asks only
    for what the proof uses: the entries of A and B are distinct inputs, each product is a vertex of
    its own with an edge from each factor, and no vertex can be reached from the products of two
    different entries. For m, k, n >= 1 every independent evaluation is in the class, whatever the
    shapes of its trees; so is a chain of fused multiply-adds; shared work upstream of the products
    is allowed. The class leaves out any vertex reached from the products of two different entries,
    such as a partial sum used by both, and it leaves out Strassen's 2 x 2 algorithm: a brute-force
    search over its graph finds no labelling at all. The class is weak at degenerate sizes (if k =
    0, or m = n = 0, every computation DAG is in it), where m k n = 0 and the bounds on m k n say
    nothing. The proof of the per-set count differs from the paper's Lemma 6.1: the products with
    both factors in a set's dominator are counted slice by slice in the inner index l: slice l has
    at most min(2S, a_l b_l) <= sqrt(2S) (a_l + b_l) / 2 of them, where a_l and b_l count the
    entries of column l of A and of row l of B in the dominator, and the 2S bounds the entries of
    the result the set meets, one vertex of its minimum set each. That gives at most S sqrt(2S)
    products per set. Strengthened: explicit constants. Corollary 4.1 gets the constant 1/5 (n log2
    n <= 5 q log2 S), Theorem 4.1 gets n (log2 n + 1) <= h S log2(2S), Corollary 6.2 gets the
    constant 1/2 (m k n <= 2 q sqrt(S)). The paper's Omega forms are stated as Mathlib's
    Asymptotics.IsBigO, since Mathlib has no Omega: g = Omega(f) becomes f = O(g), with n = 2^k and
    natural logarithms. The paper names no filter; each Omega statement here uses the strongest
    reading, a principal filter, so that one constant serves every point at once: {(k, S) : k >= 1,
    S >= 3} for Corollary 4.1, {(k, S) : k >= 1, S >= 2} for Theorem 4.1, and, for Corollary 6.2,
    the pairs (graph, S) at which the graph has a complete calculation, over any indexed collection
    of graphs of the class, possibly the whole class. The readings with n tending to infinity at
    fixed S, or with n and S tending to infinity together, follow in one line each. The
    matrix-multiplication filter could not be S >= 3: a chain of fused multiply-adds with k >= 2
    needs four red pebbles, so at S = 3 it has no calculation, Q would take minIOTime's value 0
    there, and the statement would be false. Added, not in the paper: q >= 2n for the FFT and, for k
    >= 1, q >= mk + kn + mn for matrix multiplication (every input is loaded and every output
    stored), which the paper's step from Lemma 3.1 to its corollaries silently needs for large S;
    the second bound of fft_io_bounds, which is what the paper's route gives with
    fft_parts_lower_bound applied at 2S, and its analogue for matrix multiplication; feasibility for
    the FFT (fft_complete_iff) and at every matrix size with m, k, n >= 1
    (exists_isMatMulEvaluation). The proof of Corollary 4.1 here does not go through Theorem 3.1 and
    Theorem 4.1 as the paper's does: it cuts the calculation into windows of S loads and stores
    directly. Conventions, none of which changes a result. Partitions are indexed families and may
    contain empty sets, which are counted; the paper's own construction needs them for S h >= q, so
    q <= S h can always be met and S h <= q + S is the conjunct that bounds h. The paper's P4, no
    cyclic dependence among the sets, is an ordering: an edge from set i to set j forces i <= j; a
    family has no cyclic dependence exactly when some re-indexing of it satisfies this, every
    statement here depends on a partition only through whether one exists or through its number of
    sets, and the paper's proof establishes the ordered form. No move is a no-op, which loses
    nothing, since deleting a no-op from a calculation leaves one no dearer. A computed pebble is
    placed, not slid, as in the paper's rule R3; later variants of the game that let it slide from a
    predecessor save a red pebble. A calculation records the charge of each move, so a move that
    could be either a load or a computation may be charged either way, and the bounds hold for the
    cheapest charging; in the paper, too, the player chooses which rule to apply. Where a compared
    statement could be misread: minIOTime, minParts and minDominatorParts are infima over the
    natural numbers, 0 where no calculation or partition exists; each statement about them is made
    only where one exists, and the Solution's sanity checks show each takes a genuine value (Q = 4
    for the 2-point FFT at S = 3, Q = 5 for the 1 x 1 x 2 product). The hypotheses 1 <= S and 3 <= S
    in the FFT statements restrict nothing, since a complete calculation of the FFT forces S >= 3
    and no 0-dominator partition exists; they keep each logarithm visibly away from its junk values.
    The second bounds of fft_io_bounds and matMul_io_bounds can say nothing (for S >= n/2, and for m
    k n <= S sqrt(2S)); there the first bounds carry the claim. exists_isMatMulEvaluation is about
    one graph of each size, not every graph of the class. Prior formalisation: none known. No
    earlier formalisation of the game or of these bounds was found in Lean, Coq, Isabelle or
    Prove2Me's Formalpedia (searched 2026-09-25, and again on 2026-09-28, when Formalpedia returned
    nothing for "pebble" and the only Lean code on GitHub about pebble games concerned other games:
    graph pebbling, and the pebble game of rigidity theory).

review:
  status: "self-assessed"
  reviewers:
    - "George A. Constantinides"
  notes: >-
    The author read the thirteen Lean statements and the twelve definitions they are stated through,
    item by item, against the informal claim, on a best-effort basis, in three phases on 2026-09-26
    and 2026-09-27; each phase's read preceded its proofs, which were built against the statements
    as a frozen target, and the statements and definitions compared here are those, unchanged in
    text, as described under automation.notes. He also read the documentation of the Solution
    module, on 2026-09-27, before its release; the changes made to it since, while preparing this
    submission, came after that read. His reads were preceded by the blind read-backs described
    under automation.notes and followed, on 2026-09-27, by the independent machine review described
    there. They are genuine but explicitly not a review: one person, no second reader, none of the
    systematic scrutiny a Mathlib review would apply, and no reading of the proofs by him. No human
    has read the proof development; the one reading it has had is the Codex machine read, whose
    exact scope is under automation.notes and which is neither a human read nor a second kernel. The
    library states this plainly rather than implying more, and the checks that do carry weight are
    mechanical: kernel verification, the axiom audit, the audit self-test, the frozen-target type
    check, and the sanity checks in MiscMath/Computability/RedBluePebbleGame.lean.

alignment:
  namespace: "MiscMath.Computability"
  statements:
    - source: "Hong and Kung (1981), Theorem 3.1, p. 328"
      lean: "MiscMath.Computability.exists_partition_of_hasCompleteCalculation"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "corrected"
      note: >-
        The paper's conclusion (a 2S-partition into h sets with S h >= q >= S (h - 1)) under the
        corrected model: inputs exactly the sources, and not computable. The printed statement is
        false without the correction; the proof's cover argument is repaired.
    - source: "Hong and Kung (1981), Lemma 3.1, p. 329"
      lean: "MiscMath.Computability.io_lower_bound_of_parts"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "adapted"
      note: >-
        Lemma 3.1 in finitary form: if every 2S-partition has at least h0 sets, every complete
        calculation with at most S red pebbles costs q >= S (h0 - 1), stated as S h0 <= q + S to
        avoid truncated subtraction.
    - source: "Hong and Kung (1981), Lemma 3.1, p. 329"
      lean: "MiscMath.Computability.minIOTime_lower_bound"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "adapted"
      note: >-
        Lemma 3.1 as printed, Q >= S (P(2S) - 1), in the integers, under the corrected model, and
        only where a complete calculation exists, so that Q and P(2S) are genuine minima.
    - source: "Hong and Kung (1981), Theorem 4.1 and its proof, p. 329"
      lean: "MiscMath.Computability.fft_parts_lower_bound"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "strengthened"
      note: >-
        Theorem 4.1 with an explicit constant, n (log2 n + 1) <= h S log2(2S) for every
        S-dominator partition, S >= 1. Its per-set bound d log2(2d) is at most the paper's
        2d log2 d for d >= 2, and holds at d = 1, where the paper's induction applies its own
        bound, which fails there.
    - source: "Hong and Kung (1981), Theorem 4.1, p. 329"
      lean: "MiscMath.Computability.fft_parts_lower_bound_isBigO"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "adapted"
      note: >-
        P_D(S) = Omega(n log n / (S log S)) as printed, stated as IsBigO along the principal filter
        of {(k, S) : k >= 1, S >= 2}, so that one constant serves every such n = 2^k and S.
    - source: "Not in the paper (feasibility of the FFT graph)"
      lean: "MiscMath.Computability.fft_complete_iff"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "added"
      note: >-
        For k >= 1 the 2^k-point FFT graph has a complete calculation exactly when S >= 3; it is
        the non-vacuity witness for the FFT statements.
    - source: "Not in the paper; the second bound is what the paper's route to Corollary 4.1 gives"
      lean: "MiscMath.Computability.fft_io_bounds"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "added"
      note: >-
        For k >= 1 and S >= 1, q >= 2^(k+1) (every input loaded, every output stored) and
        q >= 2^k (k + 1) / (2 log2(4S)) - S, which says nothing once S >= 2^(k-1).
    - source: "Hong and Kung (1981), Corollary 4.1, p. 329"
      lean: "MiscMath.Computability.fft_io_lower_bound"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "strengthened"
      note: >-
        Corollary 4.1 with an explicit constant: for k >= 1 and S >= 3, every complete calculation
        has 2^k k <= 5 q log2 S.
    - source: "Hong and Kung (1981), Corollary 4.1, p. 329"
      lean: "MiscMath.Computability.fft_io_lower_bound_isBigO"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "adapted"
      note: >-
        Q log S = Omega(n log n) as printed, stated as IsBigO along the principal filter of
        {(k, S) : k >= 1, S >= 3}, so that one constant serves every such n = 2^k and S.
    - source: "Not in the paper (feasibility, and non-vacuity of the class)"
      lean: "MiscMath.Computability.exists_isMatMulEvaluation"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "added"
      note: >-
        For all m, k, n >= 1 some graph of the class has a complete calculation exactly when
        S >= 3: the non-vacuity witness for the matrix-multiplication statements. It is about one
        graph of each size, not every graph of the class.
    - source: "Not in the paper; the second bound is what the paper's route to Corollary 6.2 gives"
      lean: "MiscMath.Computability.matMul_io_bounds"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "added"
      note: >-
        For k >= 1 and S >= 1, q >= mk + kn + mn and q >= m k n / sqrt(2S) - S, over the class
        IsMatMulEvaluation.
    - source: "Hong and Kung (1981), Corollary 6.2, p. 331"
      lean: "MiscMath.Computability.matMul_io_lower_bound"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "generalised"
      note: >-
        Corollary 6.2 with an explicit constant, m k n <= 2 q sqrt(S), for every graph of the class
        IsMatMulEvaluation, which is wider than the paper's independent evaluations.
    - source: "Hong and Kung (1981), Corollary 6.2, p. 331"
      lean: "MiscMath.Computability.matMul_io_lower_bound_isBigO"
      module: "MiscMath.Computability.RedBluePebbleGame"
      status: "generalised"
      note: >-
        Q sqrt(S) = Omega(m k n) as printed, over any indexed collection of graphs of the class,
        stated as IsBigO along the principal filter of the pairs (graph, S) at which the graph has
        a complete calculation, so that one constant serves the whole collection.

