# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for the Palomar submission of the Kolmogorov-Arnold representation
# theorem. The submitted project is this repository root; the Comparator configuration is
# Palomar/KolmogorovArnold/comparator.json. See Palomar/README.md.
version: "v0.4"

project:
  name: "The Kolmogorov-Arnold representation theorem"
  description: >-
    Every continuous real function on the closed unit n-cube is a superposition of continuous
    functions of one variable and addition, with the inner functions universal for the
    dimension. Three forms, each implying the next, named for who is credited with the
    statement. Lorentz-Sprecher form: there are positive constants lam_1, ..., lam_n and
    continuous strictly increasing psi_0, ..., psi_2n : R -> R, all depending only on n, such
    that every f continuous on [0,1]^n is f(x) = sum_{q=0}^{2n} g(sum_{p=1}^{n} lam_p
    psi_q(x_p)) on the cube for some continuous g : R -> R depending on f. Lorentz's form:
    continuous monotone (non-decreasing) inner functions phi_{q,p} : R -> R indexed by both q
    and p, and a single continuous outer function Phi. Kolmogorov's form: continuous phi_{q,p}
    and 2n+1 continuous outer functions Phi_q -- the theorem as proved in 1957 and as usually
    cited. In every form the inner functions are quantified before f, so one family serves
    every f; that is the content of the theorem. The statements are made for every n, the
    trivial cases n = 0 and n = 1 included, and are written in Mathlib's vocabulary alone --
    Continuous, ContinuousOn, StrictMono, Monotone, Set.Icc on Fin n -> R and finite sums --
    with no definition of their own, so that each can be audited against the informal
    statement without first accepting a definition.
  # George A. Constantinides is the author in the sense Palomar publishes: the person
  # responsible for the result. The Lean statements and proofs were generated by Claude
  # Opus 5, which is recorded under `automation` below rather than here.
  #
  # A deliberate, single deviation from the v0.4 schema, which types `project.authors` as
  # an array of strings and offers no field for an ORCID anywhere. Palomar's intake accepts
  # the author-mapping form, and a mechanical report filed with authors as plain strings
  # came back with `orcid_validation.records` empty, so a schema-conformant file simply loses
  # the identifier from the record. For a library whose citation model rests on crediting a
  # named person, having the ORCID in the permanent record is worth more than conforming on
  # this one field. Everything else here validates. Same as the two registered submissions.
  authors:
    - name: "George A. Constantinides"
      orcid: "https://orcid.org/0000-0002-0201-310X"
  license: "Apache-2.0"
  responsible_maintainers:
    - "George A. Constantinides"

classification:
  arxiv: ["math.CA"]
  msc2020: ["26B40", "41A63"]

sources:
  - title: >-
      On the representation of continuous functions of several variables by superposition of
      continuous functions of one variable and addition
    authors:
      - "A. N. Kolmogorov"
    id: "doi:10.1090/trans2/028/04"
    type: "paper"
    location: >-
      Dokl. Akad. Nauk SSSR 114 (1957), 953-956, in Russian; the identifier is that of the
      English translation, Amer. Math. Soc. Transl. (2) 28 (1963), 55-59
    relationship: "formalizes"
    note: >-
      The theorem: for n >= 2 there are continuous real psi^{pq} on [0,1] such that every
      continuous real f on the cube is sum_{q=1}^{2n+1} chi_q(sum_p psi^{pq}(x_p)) with the
      chi_q real and continuous. This is kolmogorov_arnold, stated for every n with inner
      functions continuous on all of R. His statement has no monotonicity clause; a remark
      after his Lemma 3 says the constructed psi^{pq} are monotonically increasing and that
      this could have been included in the formulation. kolmogorov_arnold follows the
      statement, not the remark; the remark's content is covered by kolmogorov_arnold_lorentz,
      which asserts monotone inner functions together with a single outer function. The
      Russian original, from mathnet.ru, is what the statement was read against.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Metric entropy, widths, and superpositions of functions"
    authors:
      - "G. G. Lorentz"
    id: "doi:10.1080/00029890.1962.11989915"
    type: "paper"
    location: "Amer. Math. Monthly 69 (1962), 469-485; Theorem 7 and equation (3)"
    relationship: "formalizes"
    note: >-
      Theorem 7 and (3): continuous monotone increasing inner functions with values in [0,1],
      indexed by both p and q (not factored), and a single outer function continuous on
      [0,s]. This is kolmogorov_arnold_lorentz, which carries his monotonicity clause as
      Monotone. Departures are strengthenings only: every n; inner functions continuous and
      monotone on all of R, with values not confined to [0,1]; outer function continuous on
      R. His footnote that Kolmogorov's 2s+1 outer functions versus one is only apparently
      weaker and in fact equivalent is the derivation kolmogorov_arnold_lorentz ->
      kolmogorov_arnold in the Solution.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On the structure of continuous functions of several variables"
    authors:
      - "David A. Sprecher"
    id: "doi:10.1090/S0002-9947-1965-0210852-X"
    type: "paper"
    location: "Trans. Amer. Math. Soc. 115 (1965), 340-355; Theorem 1"
    relationship: "adapts"
    note: >-
      Theorem 1 is the shift form: a single monotonic increasing inner function psi of the
      Hoelder class Lip[ln 2 / ln(2N+2)] (footnote 2; p. 343 notes it cannot be Lip[1]),
      rationally independent weights, and layers by shifts psi(x_p + eps q) + q. The factored
      inner functions lam_p psi_q that kolmogorov_arnold_lorentz_sprecher states are a
      corollary of it, psi_q(x) := psi(x + eps q) + q / sum lam_p, and the factoring is what
      the name credits to Sprecher. The shift form itself, as corrected by Koeppen (2002) and
      Braun-Griebel (2009), is not formalised, and no regularity beyond continuity is claimed
      of the psi_q. Sprecher credits the single outer function to Lorentz.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The Kolmogorov superposition theorem"
    authors:
      - "Torbjörn Hedberg"
    id: "doi:10.1007/BFb0058976"
    type: "book chapter"
    location: >-
      Appendix II to H. S. Shapiro, Topics in Approximation Theory, Lecture Notes in
      Mathematics 187, Springer, 1971, pp. 267-275; Theorem 1 and Remark 2. The identifier is
      the volume's.
    relationship: "formalizes"
    note: >-
      Theorem 1: sum_{k=1}^{2n+1} g(sum_p lam_p phi_k(x_p)) with phi_k continuous on [0,1],
      rationally independent real lam_p, and g continuous on all of R -- exactly the shape of
      kolmogorov_arnold_lorentz_sprecher. Remark 2: the phi_k can be taken non-decreasing by
      running the Baire argument in that closed subspace. The formal statement strengthens
      non-decreasing to strictly increasing (see Kahane) and drops the rational independence
      of the lam_p from the conclusion, asserting only their positivity. The proof route is
      his and Kahane's Baire-category argument.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Sur le théorème de superposition de Kolmogorov"
    authors:
      - "Jean-Pierre Kahane"
    id: "doi:10.1016/0021-9045(75)90035-0"
    type: "paper"
    location: "J. Approx. Theory 13 (1975), 229-234; equation (5) and the remark on p. 231"
    relationship: "formalizes"
    note: >-
      Equation (5): the same form as Hedberg's, with the inner functions in the space of
      increasing continuous phi : [0,1] -> [0,1] with phi(0) = 0 and phi(1) = 1, the lam_p
      distinct, positive and summing to 1, and g continuous on [0,1]. The remark on p. 231
      that quasi-every such phi is strictly increasing -- for rationals rho < rho' the set of
      phi with phi(rho+0) < phi(rho'-0) is open and dense -- is the source of the StrictMono
      clause in kolmogorov_arnold_lorentz_sprecher, which is stronger than any of the five
      primaries' stated theorems. His normalisations are proof devices and are not claimed.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Hilbert 13: Are there any genuine continuous multivariate real-valued functions?"
    authors:
      - "Sidney A. Morris"
    id: "doi:10.1090/bull/1698"
    type: "paper"
    location: "Bull. Amer. Math. Soc. 58 (2021), 107-118; Theorem 4.2"
    relationship: "background"
    note: >-
      Theorem 4.2 states the exact shape of kolmogorov_arnold_lorentz_sprecher -- single g,
      factored lam_p phi_k, n >= 2 -- with strictly increasing continuous inner functions,
      citing Hedberg pp. 272-273 for the strictness; the argument that yields strictness is
      Kahane's. Recorded as background because the statements were fixed and read against
      the five primaries above, and Morris was checked afterwards, on 2026-09-11, to confirm
      the strict form is not new to the literature.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On a constructive proof of Kolmogorov's superposition theorem"
    authors:
      - "Jürgen Braun"
      - "Michael Griebel"
    id: "doi:10.1007/s00365-009-9054-2"
    type: "paper"
    location: "Constr. Approx. 30 (2009), 653-675; Section 1 and Theorem 2.14"
    relationship: "background"
    note: >-
      Section 1 supplies the attributions the theorem names follow: Lorentz for the single
      outer function, Sprecher for the factored inner functions, Hedberg and Kahane for the
      Baire-category proof of Lorentz's version. Theorem 2.14 is the corrected shift form of
      Sprecher's construction, which is not formalised.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "A structured proof of Kolmogorov's Superposition Theorem"
    authors:
      - "S. Dzhenzher"
      - "A. Skopenkov"
    id: "arXiv:2105.00408"
    type: "paper"
    location: "arXiv:2105.00408 (2021); the main theorem, for n = 2"
    relationship: "background"
    note: >-
      The n = 2 instance of the factored form, with the weights fixed as 1 and sqrt 2 and
      continuous phi_k : [0,1] -> [0,1]. The n = 2 instance of kolmogorov_arnold_lorentz_sprecher
      has the same shape but asserts only positivity of the weights and, in return, strictness
      of the psi_q, so neither statement contains the other.
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/geoconuk/kolmogorov-arnold"
    relationship: "other"
    note: >-
      The standalone development this same formalisation was built in, not an earlier or
      independent formalisation.
      The three statements were fixed there as a target file with the strongest left as a
      hole, read back blind, compared against the primaries and read by the author, and the
      proof was then built against them, in six layers, without the target changing; the
      finished modules, as of its commit f291465, were copied verbatim into the submitted
      repository on 2026-09-11 with only namespaces and docstrings changed, and released
      there as v0.3.0. The submitted repository contains the substantive development and is
      the copy under its audit, conventions and release discipline, and the copy its own
      README says a citation should name; the development repository is listed so that the
      fixed-target arrangement and the order of construction can be inspected as they
      happened.
  - id: "https://github.com/leanprover/lean-eval/blob/main/LeanEval/Analysis/KolmogorovArnold.lean"
    relationship: "other"
    note: >-
      A statement only, with the proof left as a hole, of the weaker form in which the inner
      functions may depend on f (for all f there exist phi and g), posed as a benchmark
      problem. The benchmark records accepted solutions of that form, none of them published,
      so there is nothing to read or build on; neither the statement nor any solution was
      used. The submitted statements quantify the inner functions before f, which is the
      content of the theorem and what separates them from the benchmark form.

status:
  scope: >-
    Formalised: the Kolmogorov-Arnold representation theorem for every n in three forms --
    the Lorentz-Sprecher form (single outer function, factored strictly increasing inner
    functions lam_p psi_q with lam_p > 0), Lorentz's form (single outer function, monotone
    inner functions phi_{q,p}) and Kolmogorov's form (2n+1 outer functions, continuous inner
    functions) -- together with the two derivations between them. Not formalised: Sprecher's
    shift form, in which one inner function serves every layer through translates; the
    Hoelder regularity of Sprecher's inner function; and the sources' normalisations of the
    inner functions and weights (values in [0,1], phi(0) = 0, phi(1) = 1, weights summing to
    1, rational independence of the weights), which are proof devices rather than claims.
    Nothing is asserted about the outer function beyond continuity and existence: no
    uniqueness, no continuity in f. No hypothesis of a source theorem has been strengthened
    and no conclusion weakened; every departure from the sources is in the strengthening
    direction and is listed under fidelity.divergences. The three compared statements have
    no hypotheses beyond n -- the one assumption inside them, that f be continuous on the
    cube, is met by every polynomial -- so the guard against vacuity is that the conclusions
    are satisfiable in a non-degenerate way: the Solution module's Sanity checks
    section proves the n = 1 case of the Lorentz-Sprecher form outright, without the
    theorem, instantiates Kolmogorov's form at n = 2 and n = 3 so the indexing is visibly
    right, and separates the three forms at the level of witnesses. Those examples are not
    among the compared declarations because they are anonymous examples in the Solution
    module rather than named theorems, but a reviewer checking the non-vacuity claim will
    find them there.
  sorry_count: 0
  sorry_in_definitions: 0
  # v0.4 asks for every axiom used, standard ones included, so this is not the permitted
  # list but the actual one, read off the library's axiom audit, which every declaration of
  # the Solution module and its twelve support modules passes.
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # All three compared declarations, so that this inventory and comparator.json name the
  # same set.
  main_results:
    - declaration: "MiscMath.Analysis.kolmogorov_arnold_lorentz_sprecher"
      file: "MiscMath/Analysis/KolmogorovArnold.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/KolmogorovArnold/comparator.json"
    - declaration: "MiscMath.Analysis.kolmogorov_arnold_lorentz"
      file: "MiscMath/Analysis/KolmogorovArnold.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/KolmogorovArnold/comparator.json"
    - declaration: "MiscMath.Analysis.kolmogorov_arnold"
      file: "MiscMath/Analysis/KolmogorovArnold.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/KolmogorovArnold/comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The result was selected and specified by the author, who fixed which theorem to
        prove, in which forms, in what generality, and with which monotonicity clauses. The
        three Lean statements were written by Claude Opus 5, fixed as a target file outside
        the audited library with the strongest statement left as a hole, read back blind,
        compared clause by clause against the five primary papers, and read by the author,
        all before any of the proof above the rational-independence layer was built. The
        proof route -- the Baire-category argument of Hedberg and Kahane -- was then designed
        on paper from the primaries and built in six layers by Claude Opus 5 running as an
        agent against a local Mathlib checkout, iterating against the Lean compiler, in a
        separate development repository, with a type-check module asserting, once the
        theorems were proved, that the proved statements were the fixed target statements
        verbatim. No part of the proof was written by a human, and no part of it has been
        read by one.
      cost:
        wall_time: >-
          about two days of sessions for the proof, 2026-09-09 to 2026-09-10; the handover
          into the submitted repository on 2026-09-11
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Not retained verbatim. A written plan fixed the route and the layer structure before
        each layer was written, and the repository's CONTRIBUTING.md and CLAUDE.md record
        the standing instructions given for all such work, which concern statement quality
        rather than proof strategy: state results in Mathlib's vocabulary, avoid junk values
        and truncated subtraction, and guard every statement against vacuity.
  spend_usd: "subscription-based"
  notes: >-
    This submission comes from a library whose division of labour is deliberate and is
    documented in its README. The human contribution is selection, specification, and a
    best-effort read of each advertised Lean statement against its informal claim and its
    sources; the machine contribution is the formal statement and the proof. The proofs are
    read by nobody, and every declaration other than the three compared statements -- the
    whole of the twelve support modules -- is proof and may be read by no one. What defends
    the library is mechanical rather than editorial: Lean's kernel for the proofs, an axiom
    audit requiring every declaration to depend only on propext, Classical.choice and
    Quot.sound, a self-test that plants a sorry and fails if the audit does not reject it,
    autoImplicit disabled so that a mistyped identifier cannot silently become a fresh
    variable, and a non-vacuity guard for every result.
    Two arrangements specific to this result. First, the statements were fixed before the
    proof: they stood as a target with the strongest left as a hole while the six layers
    were built toward them, and a type-check module -- kept in the submitted repository as
    Palomar/KolmogorovArnold/TypeCheck.lean -- ascribes each Challenge statement to the
    shipped theorem, so the statements the author read on 2026-09-10 are the statements
    compared here. Second, before that read the three statements were read back blind: each
    rendered into English by an agent given the statement and nothing else -- no informal
    statement, no source, no docstring -- and the rendering compared against the informal
    account. All three renderings fixed the quantifier order, the single versus indexed
    outer function, the factored versus general inner functions and the n = 0 instance
    unprompted, and agreed with the informal account. One observation was passed on for the
    read: the Lorentz-Sprecher form asserts nothing about the lam_p beyond positivity, their
    rational independence being a proof device rather than a claim. The monotonicity clause
    of Lorentz's form, added after the comparison with the primaries, had a read-back of its
    own, which rendered it as non-decreasing with constant inner functions admitted. On
    2026-09-09 a read-back of an earlier draft written specifically to test for weakenings
    caught MonotoneOn where the theorem requires strictly increasing.
    After publication, on 2026-09-11, an independent review of the published copy by a
    different model (OpenAI Codex) found no defect in the three statements or in the proof
    chain and five errors in the accompanying prose, all verified against the primaries and
    corrected before this submission; none changed a Lean statement. The development record,
    with the fixed target and the layers in the order they were built, is the repository
    listed under related_formalizations.

fidelity:
  divergences: >-
    No compared statement is weaker than the corresponding claim of its source, and none
    hides a hypothesis. Every departure from the sources is a strengthening, and all are
    deliberate.
    The statements are made for every n, where the sources state n >= 2. At n = 0 the cube
    Icc 0 1 in Fin 0 -> R is a single point, the inner sum over Fin 0 is empty, and the
    representation reads f(x) = g(0) for that one point: true with g constant, and empty. At
    n = 1 the statements are true and trivial, with every inner function the identity and
    g = f/3; the Solution's sanity checks prove this instance of the Lorentz-Sprecher form
    outright. Neither degenerate case is excluded by hypothesis.
    The inner functions are continuous, and monotone or strictly monotone, on all of R, where
    the sources state them on [0,1] and sometimes confine their values to [0,1]. The outer
    function is continuous on all of R, as in Hedberg's statement; Kolmogorov, Lorentz and
    Kahane place it on a compact interval.
    The StrictMono clause of kolmogorov_arnold_lorentz_sprecher is stronger than any of the
    five primaries' stated theorems, all of which state monotonicity weakly where they state
    it at all. It is sourced to Kahane's remark that quasi-every increasing continuous
    function is strictly increasing, and Morris's Theorem 4.2 states the same strict form.
    kolmogorov_arnold_lorentz carries Lorentz's clause as Monotone, which in Mathlib means
    non-decreasing: constant inner functions are admitted there, exactly as the blind
    read-back rendered it. kolmogorov_arnold carries no monotonicity, following Kolmogorov's
    statement rather than his remark.
    What is not claimed: the sources' normalisations -- phi(0) = 0, phi(1) = 1, values in
    [0,1], weights summing to 1, rational independence of the weights -- which are proof
    devices; Sprecher's Hoelder regularity of the inner function; Sprecher's shift form,
    which is what "Sprecher's version" usually means and is why the strongest statement is
    named _lorentz_sprecher rather than _sprecher; and anything about the outer function
    beyond continuity and existence. The Lorentz-Sprecher form asserts nothing about the
    lam_p beyond positivity.
    Where a compared statement could be misread: ContinuousOn f (Icc 0 1) asks continuity of
    f on the cube only, and the representation is asserted on the cube only, so nothing is
    said about f or the representation outside it; the outer function depends on f, and the
    statements make no claim that it is unique or that it depends continuously on f; the
    three forms are each true, so as closed propositions they are equivalent, and the two
    derivations in the Solution are the whole of what "each implying the next" asserts at
    the level of theorems -- the separations in the Solution's sanity checks show only that
    each refinement is a genuine extra demand on a given inner family.
    Prior formalisation: none known with a proof. The only public Lean artefact is the
    statement of the weaker for-all-f-there-exist-phi form in leanprover/lean-eval, listed
    under related_formalizations together with this formalisation's own development record.

review:
  status: "self-assessed"
  reviewers:
    - "George A. Constantinides"
  notes: >-
    The author read the three Lean statements against the informal claim and against the
    five primary papers themselves, at the page references recorded in the Solution module's
    Source section, on 2026-09-10, and agreed them, on a best-effort basis; that read
    preceded the proof, which was built against the statements as a fixed target, and the
    statements compared here are those statements unchanged, as
    Palomar/KolmogorovArnold/TypeCheck.lean asserts. The read was preceded by the blind
    read-backs described under automation.notes and followed, on 2026-09-11, by the
    independent model review described there. It is genuine but explicitly not a review: one
    person, no second reader, none of the systematic scrutiny a Mathlib review would apply,
    and no reading of the proof. The proof development has been read by no one. The library
    states this plainly rather than implying more, and the checks that do carry weight are
    mechanical: kernel verification, the axiom audit, the audit self-test, and the sanity
    checks in MiscMath/Analysis/KolmogorovArnold.lean, which prove the n = 1 case of the
    strongest statement outright and separate the three forms at the level of witnesses.

alignment:
  namespace: "MiscMath.Analysis"
  statements:
    - source: >-
        Hedberg (1971), Theorem 1 and Remark 2; Kahane (1975), (5) and the remark on p. 231;
        Sprecher (1965) for the factored inner functions
      lean: "MiscMath.Analysis.kolmogorov_arnold_lorentz_sprecher"
      module: "MiscMath.Analysis.KolmogorovArnold"
      status: "adapted"
      note: >-
        Adapted only by strengthening: strictly increasing rather than non-decreasing inner
        functions, every n rather than n >= 2, inner functions on all of R, and no
        normalisation or rational-independence clause in the conclusion -- the lam_p are
        asserted positive and nothing more. The shape is Hedberg's Theorem 1 with g
        continuous on R; the strict form is also Morris (2021), Theorem 4.2.
    - source: "Lorentz (1962), Theorem 7 and equation (3)"
      lean: "MiscMath.Analysis.kolmogorov_arnold_lorentz"
      module: "MiscMath.Analysis.KolmogorovArnold"
      status: "adapted"
      note: >-
        Adapted only by strengthening: every n, inner functions continuous and monotone on
        all of R with values not confined to [0,1], outer function continuous on R rather
        than on [0,s]. Carries his monotonicity clause as Monotone, that is, non-decreasing.
        Derived in the Solution from the Lorentz-Sprecher form by phi_{q,p} := lam_p * psi_q.
    - source: "Kolmogorov (1957), the theorem"
      lean: "MiscMath.Analysis.kolmogorov_arnold"
      module: "MiscMath.Analysis.KolmogorovArnold"
      status: "adapted"
      note: >-
        Adapted only by strengthening: every n rather than n >= 2, and inner functions
        continuous on all of R rather than on [0,1]. No monotonicity clause, as in his
        statement. Derived in the Solution from Lorentz's form by taking every outer function
        to be the single one.

acknowledgements: >-
  Built on Mathlib, whose Baire category theorem for complete metrizable spaces, sup-norm
  and second-countability structure on continuous maps out of a compact space, Tietze
  extension theorem, Liouville number (for the rational independence of the weights) and
  Set.projIcc the proof rests on.
