name = "MiscMath"
version = "0.4.0"
keywords = ["math", "mathlib"]
defaultTargets = ["MiscMath"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
# `autoImplicit` turns an unbound identifier into a fresh implicit universally
# quantified variable. A single typo in a theorem statement then produces a
# different — often vacuous — theorem that still compiles. Since nothing here is
# reviewed by a human, this must stay off; `scripts/check-conventions.sh` rejects
# any file that re-enables it locally.
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Pinned to a release candidate, deliberately. Since 2026-09-23 Palomar has required the
# submitted toolchain to be v4.35.0-rc2 or later, and `lean-toolchain` must be exactly the
# toolchain of the pinned Mathlib revision. Palomar also requires that revision to be an
# ancestor of Mathlib's canonical `master`: minor releases and release candidates are cut on
# master through a pull request and satisfy that; **patch releases are cut on a release branch
# and never do**. v4.33.1 carried one commit master had never seen, and a submission pinned to
# it was rejected before anything was compiled. See Palomar/README.md.
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MiscMath"
# `MiscMath.*` is `MiscMath` itself and every module beneath it (note that Lake's
# `.+` means submodules *excluding* the root), so a result file is compiled whether
# or not anything imports it. Being compiled is not enough to be *audited*, though —
# the axiom audit only sees what `MiscMath/Audit.lean` imports, and a module's private
# declarations only through an `import all` that names it — which is why
# `scripts/check-imports.sh` separately requires every module to be reachable from
# `MiscMath.lean` and named by an `import all` in `MiscMath/Audit.lean`.
globs = ["MiscMath.*"]

# The Palomar submission's Challenge module: the statement surface of
# `MiscMath/Geometry/SphereCoveringExponent.lean`, restated without proofs so that the
# Palomar registry's Comparator can check the shipped theorems against it. It is
# deliberately *not* in `defaultTargets`: a Challenge states its theorems with `sorry`,
# which is exactly what a statement surface is for and exactly what this library forbids
# everywhere else. Keeping it out of the default build keeps it out of `lake build`, out
# of `MiscMath/Audit.lean`'s import closure, and out of the three checks in `scripts/`,
# all of which are scoped to `MiscMath/`. Build it explicitly with
# `lake build PalomarWynerChallenge`. See `Palomar/README.md`.
[[lean_lib]]
name = "PalomarWynerChallenge"
roots = ["Palomar.Wyner.Challenge"]

# Guards `Palomar/Wyner/Challenge.lean` against drifting from the library it advertises,
# by ascribing each Challenge statement to the theorem `MiscMath` actually ships. Contains
# no `sorry` — it asserts the real theorems — but stays out of `defaultTargets` so that
# `lake build` keeps meaning exactly what `CLAUDE.md` says it means. Build it with
# `lake build PalomarWynerTypeCheck`.
[[lean_lib]]
name = "PalomarWynerTypeCheck"
roots = ["Palomar.Wyner.TypeCheck"]

# The Palomar submission for Hoeffding's extrema at a fixed mean, on the same footing as
# the Wyner pair above: a Challenge stating the theorems with `sorry`, and a TypeCheck
# ascribing each Challenge statement to the theorem `MiscMath` actually ships. Neither is
# in `defaultTargets`, so neither reaches `lake build`, `MiscMath/Audit.lean`, or the
# three checks in `scripts/`. Build them with `lake build PalomarHoeffdingChallenge` and
# `lake build PalomarHoeffdingTypeCheck`. See `Palomar/README.md`.
[[lean_lib]]
name = "PalomarHoeffdingChallenge"
roots = ["Palomar.Hoeffding.Challenge"]

[[lean_lib]]
name = "PalomarHoeffdingTypeCheck"
roots = ["Palomar.Hoeffding.TypeCheck"]

# The Palomar submission for the Kolmogorov–Arnold representation theorem, on the same
# footing as the two pairs above: a Challenge stating the three theorems with `sorry`, and a
# TypeCheck ascribing each Challenge statement to the theorem `MiscMath` actually ships.
# Neither is in `defaultTargets`, so neither reaches `lake build`, `MiscMath/Audit.lean`, or
# the three checks in `scripts/`. Build them with `lake build PalomarKolmogorovArnoldChallenge`
# and `lake build PalomarKolmogorovArnoldTypeCheck`. See `Palomar/README.md`.
[[lean_lib]]
name = "PalomarKolmogorovArnoldChallenge"
roots = ["Palomar.KolmogorovArnold.Challenge"]

[[lean_lib]]
name = "PalomarKolmogorovArnoldTypeCheck"
roots = ["Palomar.KolmogorovArnold.TypeCheck"]

# The frozen target statements of the red-blue pebble game (`MiscMath.Computability.
# RedBluePebbleGame`): its advertised theorems, stated with `sorry` before they are proved and
# frozen once read, so that the proofs can be held to them. On the same footing as the
# Palomar Challenges above: not in `defaultTargets`, so it reaches neither `lake build`,
# `MiscMath/Audit.lean`, nor the three checks in `scripts/`. Build it with
# `lake build RedBluePebbleGameTarget`.
[[lean_lib]]
name = "RedBluePebbleGameTarget"
roots = ["Target.RedBluePebbleGame"]

# Holds the red-blue pebble game's proved theorems to the frozen targets above, by ascribing each
# target's type to the theorem `MiscMath` ships. No `sorry` of its own, but outside
# `defaultTargets` for the same reason as the Palomar TypeChecks. Build it with
# `lake build RedBluePebbleGameTypeCheck`.
[[lean_lib]]
name = "RedBluePebbleGameTypeCheck"
roots = ["Target.RedBluePebbleGame.TypeCheck"]
