name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Cheap textual guards first: they need no toolchain, so a convention slip
      # fails in seconds rather than after a full Mathlib build.
      - name: Check every result module is imported by the root
        run: ./scripts/check-imports.sh

      - name: Check file conventions
        run: ./scripts/check-conventions.sh

      # `lake build` compiles the library *and* runs the axiom audit, because
      # `MiscMath/Audit.lean` invokes `#audit_axioms` at elaboration time and is part
      # of the default target. There is deliberately no separate audit step to forget.
      - uses: leanprover/lean-action@v1

      # Confirm the audit is still capable of failing. Cheap here — Mathlib is already
      # built by this point — and it is the only thing standing between us and an audit
      # that silently reports success for zero declarations.
      - name: Self-test the axiom audit
        run: ./scripts/self-test-audit.sh

      # `homepage` is load-bearing. The action decides whether to build a Jekyll
      # landing page with a literal `[ -d <homepage> ]`, and the input defaults to
      # `docs` — which here is the template/examples directory, not a Jekyll site.
      # Left at the default it detects one, runs ruby/setup-ruby with
      # `bundler-cache: true` against `docs/`, and bundler exits 10 ("could not locate
      # Gemfile"). Pointing it at a folder that does not exist skips the Jekyll steps;
      # uploading and deploying the API docs is gated separately and still happens.
      #
      # Note the pinned `@v1` accepts only api_docs, blueprint, homepage, build_args
      # and lake_package_directory. The action's `main` branch has a larger set
      # (including `build-page` and `deploy`) that v1 will silently ignore with only a
      # warning — check the inputs against the ref actually pinned before editing.
      - uses: leanprover-community/docgen-action@v1
        with:
          homepage: .no-jekyll-homepage
